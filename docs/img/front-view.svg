<text x="610.0" y="380.0" font-size="13" text-anchor="start" fill="#4b5563" font-weight="600">roll ±60°</text>
<line x1="500" y1="224.0" x2="834.3" y2="224.0" stroke="#4b5563" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="667.1" y="216.0" font-size="12" text-anchor="middle" fill="#4b5563" font-weight="normal">head moves 1.67 m sideways</text>
<text x="30.0" y="880.0" font-size="13" text-anchor="start" fill="#111827" font-weight="normal">• Roll pivots on the virtual ground, like a real bike leaning on its tyres — so lean feels right with no software fakery.</text>
<text x="30.0" y="906.0" font-size="13" text-anchor="start" fill="#111827" font-weight="normal">• All roll and pitch drives hang BELOW the pivot. Nothing pokes up where the boots and the bike's belly swing.</text>
<text x="30.0" y="932.0" font-size="13" text-anchor="start" fill="#111827" font-weight="normal">• Inside peg at 60°: the real-world peg-drag angle. Whips past 60° are carried by VR visuals + onset cue.</text>
<text x="30.0" y="958.0" font-size="13" text-anchor="start" fill="#111827" font-weight="normal">• Pivot 0.6 m off the floor gives room for the hanging drives and keeps a dangled foot clear of the floor.</text>
</svg>
<text x="30" y="40" font-size="22" font-weight="700" fill="#111827">MX motion rig — front elevation</text>
<text x="30" y="64" font-size="14" fill="#4b5563">Upright (solid) and full 60° lean (ghost). At 60° the inside peg reaches the virtual ground — same as dragging a peg for real.</text>

